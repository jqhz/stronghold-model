<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stronghold Viewer</title>
  <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.55); color: #fff; padding: 10px; border-radius: 6px; max-width: 320px; }
    #info a { color: #9cf; }
    #canvas-container { width: 100vw; height: 100vh; }
    #stronghold-picker { position: absolute; top: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.55); color: #fff; padding: 10px; border-radius: 6px; }
    #stronghold-picker a { color: #9cf; }
    #stronghold-picker button { display: block; margin: 8px 0; padding: 6px 12px; background: #333; color: #fff; border: none; border-radius: 12px; cursor: pointer; }
    .loading-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.78); display: flex; align-items: center; justify-content: center; z-index: 30; pointer-events: auto; }
    .loading-overlay.hidden { display: none; }
    .loading-content { text-align: center; color: #fff; font-size: 1rem; }
    .loading-spinner { width: 52px; height: 52px; border: 6px solid rgba(255,255,255,0.18); border-top-color: #82b1ff; border-radius: 50%; animation: spin 0.85s linear infinite; margin: 0 auto 12px; }
    .loading-bar-container { width: 240px; height: 14px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; overflow: hidden; margin: 12px auto 0; }
    .loading-bar-fill { height: 100%; background: linear-gradient(90deg, #82b1ff 0%, #ffff00 100%); width: 0%; transition: width 0.2s ease; }
    .loading-percentage { margin-top: 8px; font-size: 0.85rem; color: #ccc; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="info">
    <strong>Stronghold Viewer</strong><br />
    <!-- Drag to orbit, scroll to zoom, middle-click to pan.<br /> -->
    <span id="status">Loading stronghold data...</span><br />
    <span id="prDepth">Portal Room Depth: <span id="prDepthValue">(0)</span></span><br />
    <span id="prDistance">Portal Room Blocks to Start: <span id="prDistanceValue">(0)</span></span><br />
    <span id="spike"> Can get spike? <span id="spikeValue"></span></span><br />
    <div id="controls" style="margin-top:8px; line-height:1.6;">
      <label>Seed <input id="seedInput" type="text" style="width:220px;" /></label><br />
      <label>Chunk X <input id="chunkXInput" type="number" step="1" style="width:80px;" /></label>
      <label>Chunk Z <input id="chunkZInput" type="number" step="1" style="width:80px; margin-left:8px;" /></label><br />
      <button id="generateButton" style="margin-top:6px; padding:4px 10px;">Generate</button>
    </div>
    <input type="checkbox" id="toggleBounds" checked /> <label for="toggleBounds">Show Stronghold Bounds</label><br />
    <input type="checkbox" id="toggleChunkborders" checked /> <label for="toggleChunkborders">Show Chunkborder Lines</label><br />
    <input type="checkbox" id="togglePathline" checked /> <label for="togglePathline">Show Path to Portal</label><br />
    <input type="checkbox" id="forceMPK" checked /> <label for="forceMPK">Force MPK Stronghold</label><br />
    <strong>Legend</strong><br />
    <span> Total Rooms: <span id="legendTotalRooms">(0)</span></span><br />
    <span style="color:#82b1ff">■</span> Start <span id="legendStartCount">(0/1)</span><br />
    <span style="color:#ff9d00">■</span> PortalRoom <span id="legendPortalCount">(0/1)</span><br />
    <span style="color:#7cff8b">■</span> Library <span id="legendLibraryCount">(0/2)</span><br />
    <span style="color:#ff77a9">■</span> SpiralStaircase <span id="legendSpiralCount">(0)</span><br />
    <span style="color:#972851">■</span> StraightStaircase <span id="legendStraightCount">(0)</span><br />
    <span style="color:#8c8c8c">■</span> Other pieces <span id="legendOtherCount">(0)</span><br />
    <!-- <small style="display:block; margin-top:8px; color:#ccc; line-height:1.4; max-width:260px;">
      Chunk borders align to Minecraft world coordinates and start at x/z multiples of 16.
    </small> -->
  </div>
  <div id="stronghold-picker">
    <button id="stronghold1">Stronghold 1</button>
    <button id="stronghold2">Stronghold 2</button>
    <button id="stronghold3">Stronghold 3</button>
  </div>
  <div id="canvas-container"></div>
  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="loading-content">
      <div id="loadingText">Rendering stronghold model...</div>
      <div class="loading-bar-container">
        <div id="loadingBarFill" class="loading-bar-fill"></div>
      </div>
      <div id="loadingPercentage" class="loading-percentage">0%</div>
    </div>
  </div>
  <!-- <script type="module" src="get_mpk_stronghold.js"></script> -->
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js';
    import { OrbitControls } from './OrbitControls.module.js';
    import { get_mpk_stronghold } from './get_mpk_stronghold.js';
    import { buildGraph, shortestPath } from './pathfinder.js';

    const container = document.getElementById('canvas-container');
    const status = document.getElementById('status');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
    camera.position.set(0, 200, 400);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;

    const grid = new THREE.GridHelper(1024, 64, 0x444444, 0x222222);
    grid.position.y = 0;
    scene.add(grid);

    const axes = new THREE.AxesHelper(128);
    scene.add(axes);

    const ambient = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambient);

    const directional = new THREE.DirectionalLight(0xffffff, 0.8);
    directional.position.set(100, 200, 100);
    scene.add(directional);

    const pieceMaterials = {
      Start: new THREE.MeshPhongMaterial({ color: 0x82b1ff, opacity: 0.85, transparent: true }),
      PortalRoom: new THREE.MeshPhongMaterial({ color: 0xff9d00, opacity: 0.85, transparent: true }),
      Library: new THREE.MeshPhongMaterial({ color: 0x7cff8b, opacity: 0.85, transparent: true }),
      SpiralStaircase: new THREE.MeshPhongMaterial({ color: 0xff77a9, opacity: 0.85, transparent: true }),
      Stairs: new THREE.MeshPhongMaterial({ color: 0x972851, opacity: 0.85, transparent: true }),
      default: new THREE.MeshPhongMaterial({ color: 0x8c8c8c, opacity: 0.85, transparent: true })
    };

    function materialFor(type) {
      return pieceMaterials[type] || pieceMaterials.default;
    }

    function addBox(piece) {
      const width = piece.maxX - piece.minX + 1;
      const height = piece.maxY - piece.minY + 1;
      const depth = piece.maxZ - piece.minZ + 1;
      const geometry = new THREE.BoxGeometry(width, height, depth);
      const material = materialFor(piece.type).clone();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(piece.minX + width / 2 - 0.5, piece.minY + height / 2 - 0.5, piece.minZ + depth / 2 - 0.5);
      mesh.userData = piece;
      scene.add(mesh);
      sceneObjects.push(mesh);

      const edges = new THREE.EdgesGeometry(geometry);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 1 }));
      line.position.copy(mesh.position);
      scene.add(line);
      sceneObjects.push(line);
    }

    const sceneObjects = [];
    // const jarName = './stronghold.jar';
    const defaultSeed = '-5853861396804051592';
    const defaultChunkX = '-85';
    const defaultChunkZ = '43';

    const seedField = document.getElementById('seedInput');
    const chunkXField = document.getElementById('chunkXInput');
    const chunkZField = document.getElementById('chunkZInput');
    const generateField = document.getElementById('generateButton');
    const toggleBounds = document.getElementById('toggleBounds');
    const toggleChunkborders = document.getElementById('toggleChunkborders');
    const togglePathline = document.getElementById('togglePathline');
    const forceMPK = document.getElementById('forceMPK');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingBarFill = document.getElementById('loadingBarFill');
    const loadingPercentage = document.getElementById('loadingPercentage');

    const stronghold1 = document.getElementById('stronghold1');
    const stronghold2 = document.getElementById('stronghold2');
    const stronghold3 = document.getElementById('stronghold3');

    const prDepthValue = document.getElementById('prDepthValue');
    const prDistanceValue = document.getElementById('prDistanceValue');
    const spikeValue = document.getElementById('spikeValue');

    let strongholds = []; // Store stronghold data
    let activeStrongholdIndex = null; // stronghold currently rendered
    let mpkStrongholdIndex = null; // MPK candidate for the loaded seed (label persists until seed changes)
    const roomLimits = { Start: 1, PortalRoom: 1, Library: 2, Stairs: 5 };
    const loadedJars = new Set();
    const chunkBorderGroup = new THREE.Group();
    let pathMesh = null;
    let boundsHelper = null;
    let currentPieceBounds = null;
    let currentPieceData = [];
    let pieceDepths = [];
    let pieceAges = [];
    
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredObject = null;

    // tooltip
    const tooltip = document.createElement('div');
    tooltip.style.position = 'absolute';
    tooltip.style.pointerEvents = 'none';
    tooltip.style.background = 'rgba(0,0,0,0.8)';
    tooltip.style.color = '#fff';
    tooltip.style.padding = '6px 8px';
    tooltip.style.borderRadius = '6px';
    tooltip.style.fontSize = '12px';
    tooltip.style.display = 'none';
    tooltip.style.zIndex = 40;
    document.body.appendChild(tooltip);

    seedField.value = parseQueryParam('seed', defaultSeed);
    chunkXField.value = parseQueryParam('chunkX', defaultChunkX);
    chunkZField.value = parseQueryParam('chunkZ', defaultChunkZ);

    generateField.addEventListener('click', loadData);
    toggleBounds.addEventListener('change', () => {
      if (boundsHelper) {
        boundsHelper.visible = toggleBounds.checked;
      }
    });
    toggleChunkborders.addEventListener('change', () => {
      if (currentPieceBounds) {
        updateChunkBorders(currentPieceBounds);
      }
    });
    togglePathline.addEventListener('change', () => {
      if (currentPieceData.length) {
        drawPath(currentPieceData);
      }
    });
    forceMPK.addEventListener('change', updateForceMPKUI);
    updateForceMPKUI();

    function clearScene() {
      while (sceneObjects.length > 0) {
        const object = sceneObjects.pop();
        scene.remove(object);
        if (object.geometry) {
          object.geometry.dispose();
        }
        if (object.material) {
          object.material.dispose();
        }
      }
    }

    function parseQueryParam(name, defaultValue = '0') {
      const value = new URLSearchParams(window.location.search).get(name);
      return value !== null ? value : defaultValue;
    }

    function renderData(data) {
      let orientation = '';
      const p1 = data.pieces[0].minX;
      const p2 = data.pieces[0].minZ;
      const p3 = data.pieces[0].maxX;
      const p4 = data.pieces[0].maxZ;
      const p5 = data.pieces[1].minX;
      const p6 = data.pieces[1].minZ;
      const p7 = data.pieces[1].maxX;
      const p8 = data.pieces[1].maxZ;

      if (Math.abs(p4 - p6) === 1)
        orientation = 'South (+Z)';
      else if (Math.abs(p2 - p8) === 1)
        orientation = 'North (-Z)';
      else if (Math.abs(p1 - p7) === 1)
        orientation = 'West (-X)';
      else if (Math.abs(p3 - p5) === 1)
        orientation = 'East (+X)';
      else
        orientation = 'Unknown';

      status.textContent = `seed=${String(data.worldSeed)} \n chunk=(${data.chunkX},${data.chunkZ}) start=(${data.startX},${data.startZ}) \n orientation=${orientation}`; ;
      // prDepthValue.textContent = `${prDepthValue}`;
      // prDistanceValue.textContent = `${parseInt(prDistanceValue)}`;
      // spikeValue.textContent = `${prDistanceValue > 70 ? "Too Far (> 70 Blocks)" : 'Yes'}`;
      clearScene();
      data.pieces.forEach(addBox);

      const bounds = new THREE.Box3();
      data.pieces.forEach(p => {
        bounds.expandByPoint(new THREE.Vector3(p.minX, p.minY, p.minZ));
        bounds.expandByPoint(new THREE.Vector3(p.maxX, p.maxY, p.maxZ));
      });

      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());
      controls.target.copy(center);
      camera.position.set(center.x + size.x * 1.2, center.y + size.y * 0.8 + 50, center.z + size.z * 1.2);
      camera.lookAt(center);

      if (boundsHelper) {
        scene.remove(boundsHelper);
        const helperIndex = sceneObjects.indexOf(boundsHelper);
        if (helperIndex !== -1) sceneObjects.splice(helperIndex, 1);
        disposeObject(boundsHelper);
        boundsHelper = null;
      }
      boundsHelper = new THREE.Box3Helper(bounds, 0xffff00);
      boundsHelper.visible = toggleBounds.checked;
      scene.add(boundsHelper);
      sceneObjects.push(boundsHelper);

      currentPieceBounds = bounds;
      currentPieceData = data.pieces;
      computePieceDepths(data.pieces);
      updateLegendCounts(data.pieces);
      drawPath(data.pieces);
      updateChunkBorders(bounds);
    }

    function computePieceDepths(pieces) {
      // Assign ages directly from the JSON order (1-indexed)
      pieceAges = pieces.map((_, i) => i + 1);
      for (let i = 0; i < pieces.length; i++) {
        pieces[i].age = pieceAges[i];
      }

      // Prepare depth and path containers
      pieceDepths = new Array(pieces.length).fill(null);
      const graph = buildGraph(pieces);
      // If there's no start node, leave depths null but ages are still assigned
      if (graph.startIndex === -1) {
        for (let i = 0; i < pieces.length; i++) {
          pieces[i].depth = null;
          pieces[i].path = null;
        }
        return;
      }

      // BFS from the start index to compute shortest-path depths and predecessor chain
      const prev = new Array(pieces.length).fill(-1);
      const depth = new Array(pieces.length).fill(null);
      const queue = [graph.startIndex];
      depth[graph.startIndex] = 0;
      prev[graph.startIndex] = -1;

      let qi = 0;
      while (qi < queue.length) {
        const current = queue[qi++];
        for (const neighbor of graph.adj.get(current) || []) {
          if (depth[neighbor] === null) {
            depth[neighbor] = depth[current] + 1;
            prev[neighbor] = current;
            queue.push(neighbor);
          }
        }
      }

      // Reconstruct paths and assign depths
      for (let i = 0; i < pieces.length; i++) {
        if (depth[i] != null) {
          // reconstruct path from start -> i
          const path = [];
          let cur = i;
          while (cur !== -1) {
            path.push(cur);
            cur = prev[cur];
          }
          path.reverse();
          pieces[i].path = path;
          pieces[i].depth = depth[i];
          pieceDepths[i] = depth[i];
        } else {
          pieces[i].path = null;
          pieces[i].depth = null;
          pieceDepths[i] = null;
        }
        if (pieces[i].type === 'PortalRoom') {
          prDepthValue.textContent = `${depth[i]}`;
          const prCenter = getPieceCenter(pieces[i]);
          const startCenter = getPieceCenter(pieces[0]);
          prDistanceValue.textContent = `${parseInt(prCenter.distanceTo(startCenter))}`;
          spikeValue.textContent = `${prCenter.distanceTo(startCenter) > 64 ? "Too Far (> 64 Blocks)" : 'Yes'}`;
        }
      }
    }

    function setLoading(isLoading, message = 'Rendering stronghold model...', percent = 0) {
      loadingOverlay.classList.toggle('hidden', !isLoading);
      document.getElementById('loadingText').textContent = message;
      loadingBarFill.style.width = `${percent}%`;
      loadingPercentage.textContent = `${percent}%`;
      disableControls(isLoading);
    }

    function disableControls(disabled) {
      seedField.disabled = disabled;
      chunkXField.disabled = disabled;
      chunkZField.disabled = disabled;
      generateField.disabled = disabled;
      toggleBounds.disabled = disabled;
      toggleChunkborders.disabled = disabled;
      togglePathline.disabled = disabled;
      forceMPK.disabled = disabled;
      stronghold1.disabled = disabled;
      stronghold2.disabled = disabled;
      stronghold3.disabled = disabled;
    }

    function updateLegendCounts(pieces) {
      const counts = pieces.reduce((acc, piece) => {
        acc[piece.type] = (acc[piece.type] || 0) + 1;
        return acc;
      }, {});
      const otherCount = pieces.length - (counts.Start || 0) - (counts.PortalRoom || 0) - (counts.Library || 0) - (counts.SpiralStaircase || 0) - (counts.Stairs || 0);
      document.getElementById('legendTotalRooms').textContent = `(${pieces.length})`;
      document.getElementById('legendStartCount').textContent = `(${counts.Start || 0}/${roomLimits.Start})`;
      document.getElementById('legendPortalCount').textContent = `(${counts.PortalRoom || 0}/${roomLimits.PortalRoom})`;
      document.getElementById('legendLibraryCount').textContent = `(${counts.Library || 0}/${roomLimits.Library})`;
      document.getElementById('legendStraightCount').textContent = `(${counts.Stairs || 0}/${roomLimits.Stairs})`;
      document.getElementById('legendSpiralCount').textContent = `(${counts.SpiralStaircase || 0}/${roomLimits.Stairs})`;
      document.getElementById('legendOtherCount').textContent = `(${otherCount})`;
    }

    function disposeObject(object) {
      if (object.geometry) {
        object.geometry.dispose();
      }
      if (object.material) {
        if (Array.isArray(object.material)) {
          object.material.forEach(mat => mat.dispose && mat.dispose());
        } else {
          object.material.dispose && object.material.dispose();
        }
      }
    }

    function clearChunkBorderGroup() {
      while (chunkBorderGroup.children.length > 0) {
        const child = chunkBorderGroup.children.pop();
        if (child.geometry) child.geometry.dispose();
        if (child.material) child.material.dispose();
        chunkBorderGroup.remove(child);
      }
    }

    function createChunkBorders(bounds) {
      clearChunkBorderGroup();
      const minX = Math.floor(bounds.min.x / 16) * 16;
      const maxX = Math.ceil(bounds.max.x / 16) * 16;
      const minZ = Math.floor(bounds.min.z / 16) * 16;
      const maxZ = Math.ceil(bounds.max.z / 16) * 16;
      const positions = [];

      // Horizontal grid lines at y=0
      for (let x = minX; x <= maxX; x += 16) {
        positions.push(x, 0, minZ, x, 0, maxZ);
      }
      for (let z = minZ; z <= maxZ; z += 16) {
        positions.push(minX, 0, z, maxX, 0, z);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      const material = new THREE.LineBasicMaterial({ color: 0x999999, opacity: 0.65, transparent: true });
      const lineSegments = new THREE.LineSegments(geometry, material);
      chunkBorderGroup.add(lineSegments);

      // Vertical pillars: for each grid intersection create a vertical line spanning bounds
      const vertPositions = [];
      const minY = Math.floor((bounds.min.y - 16) / 16) * 16;
      const maxY = Math.ceil((bounds.max.y + 16) / 16) * 16;
      for (let x = minX; x <= maxX; x += 16) {
        for (let z = minZ; z <= maxZ; z += 16) {
          vertPositions.push(x, minY, z, x, maxY, z);
        }
      }
      const vgeo = new THREE.BufferGeometry();
      vgeo.setAttribute('position', new THREE.Float32BufferAttribute(vertPositions, 3));
      const vlines = new THREE.LineSegments(vgeo, material.clone());
      chunkBorderGroup.add(vlines);

      chunkBorderGroup.position.y = 0;
      if (!scene.children.includes(chunkBorderGroup)) {
        scene.add(chunkBorderGroup);
      }
    }

    function updateChunkBorders(bounds) {
      if (toggleChunkborders.checked) {
        createChunkBorders(bounds);
      } else {
        if (scene.children.includes(chunkBorderGroup)) {
          scene.remove(chunkBorderGroup);
        }
      }
    }

    function getPieceCenter(piece) {
      return new THREE.Vector3(
        piece.minX + (piece.maxX - piece.minX) / 2,
        piece.minY + (piece.maxY - piece.minY) / 2,
        piece.minZ + (piece.maxZ - piece.minZ) / 2
      );
    }

    function drawPath(pieces) {
      if (pathMesh) {
        scene.remove(pathMesh);
        disposeObject(pathMesh);
        const index = sceneObjects.indexOf(pathMesh);
        if (index !== -1) sceneObjects.splice(index, 1);
        pathMesh = null;
      }

      if (!togglePathline.checked) {
        return;
      }

      const graph = buildGraph(pieces);
      if (graph.startIndex === -1 || graph.portalIndex === -1) return;
      const pathIdx = shortestPath(graph.adj, graph.startIndex, graph.portalIndex);
      if (!pathIdx || pathIdx.length === 0) return;

      const points = pathIdx.map(i => getPieceCenter(pieces[i]));
      const pathGeometry = new THREE.BufferGeometry().setFromPoints(points);
      const pathMaterial = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 8, transparent: true, opacity: 0.95, depthTest: false, depthWrite: false });
      pathMesh = new THREE.Line(pathGeometry, pathMaterial);
      pathMesh.renderOrder = 999;
      scene.add(pathMesh);
      sceneObjects.push(pathMesh);

      // store distances for tooltip depth
      window._pieceDepths = {};
      pathIdx.forEach((idx, i) => { window._pieceDepths[idx] = i; });
    }

    // mouse interactions
    function onPointerMove(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(sceneObjects.filter(o => o.isMesh));
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        if (hoveredObject !== obj) {
          if (hoveredObject) {
            hoveredObject.material.emissive && hoveredObject.material.emissive.setHex(0x000000);
            hoveredObject.material.opacity = hoveredObject.userData._origOpacity || hoveredObject.material.opacity;
          }
          hoveredObject = obj;
          hoveredObject.userData._origOpacity = hoveredObject.material.opacity;
          hoveredObject.material.emissive && hoveredObject.material.emissive.setHex(0x444444);
          hoveredObject.material.opacity = Math.min(1, hoveredObject.material.opacity + 0.15);
        }
      } else {
        if (hoveredObject) {
          hoveredObject.material.emissive && hoveredObject.material.emissive.setHex(0x000000);
          hoveredObject.material.opacity = hoveredObject.userData._origOpacity || hoveredObject.material.opacity;
          hoveredObject = null;
        }
      }
    }

    function onPointerDown(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera({ x, y }, camera);
      const intersects = raycaster.intersectObjects(sceneObjects.filter(o => o.isMesh));
      if (intersects.length > 0) {
        const obj = intersects[0].object;
        const piece = obj.userData;
        if (!piece) return;
        const pieces = sceneObjects.map(o => o.userData).filter(Boolean);
        const index = pieces.indexOf(piece);
        const age = (typeof piece.age !== 'undefined') ? piece.age : (pieceAges[index] != null ? pieceAges[index] : index + 1);
        const depth = (typeof piece.depth !== 'undefined' && piece.depth !== null) ? piece.depth : (pieceDepths[index] != null ? pieceDepths[index] : 'N/A');
        tooltip.style.left = `${event.clientX + 12}px`;
        tooltip.style.top = `${event.clientY + 12}px`;
        tooltip.innerHTML = `<strong>${piece.type}</strong><br/>Age: ${age}<br/>Depth: ${depth}`;
        tooltip.style.display = 'block';
        setTimeout(() => { tooltip.style.display = 'none'; }, 6000);
      }
    }

    renderer.domElement.addEventListener('pointermove', onPointerMove);
    renderer.domElement.addEventListener('pointerdown', onPointerDown);

    window.cheerpjInitialized = window.cheerpjInitialized || false;
    async function initCheerpJ() { // 1
      if (window.cheerpjInitialized) return; // Stop if already running
      window.cheerpjInitialized = true;
      if (!window.cheerpjInit) {
        throw new Error('CheerpJ loader did not initialize.');
      }
      if (!window.cheerpjRunMain || !window.cheerpjRunJar) {
        await cheerpjInit({version: 17});
      }
      if (!window.cheerpjRunJar || !window.cheerpjRunMain) {
        throw new Error('CheerpJ runtime did not expose expected APIs.');
      }
    }

    async function loadJar(jarName) {
      if (loadedJars.has(jarName)) {
        return;
      }
      try {
        const jarResult = cheerpjRunJar(jarName);
        if (jarResult && typeof jarResult.then === 'function') {
          await jarResult;
        }
        loadedJars.add(jarName);
      } catch (error) {
        throw new Error(`Failed to load ${jarName}: ${error.message}`);
      }
    }

    async function runStrongholdJar(seed, chunkX, chunkZ) { // 4
      await loadJar('/app/stronghold.jar');
      const args = [String(seed), parseInt(chunkX), parseInt(chunkZ)];

      async function runMainWithClasspath(classPath) {
        let captured = '';
        const originalConsole = {
          log: console.log,
          info: console.info,
          warn: console.warn,
          error: console.error,
        };

        const capture = (...values) => {
          captured += values.map(v => String(v)).join(' ') + '\n';
        };

        console.log = (...values) => { capture(...values); originalConsole.log(...values); };
        console.info = (...values) => { capture(...values); originalConsole.info(...values); };
        console.warn = (...values) => { capture(...values); originalConsole.warn(...values); };
        console.error = (...values) => { capture(...values); originalConsole.error(...values); };

        try {
          window.CHEERP_ARGV = args;
          const result = cheerpjRunMain("kaptainwutax.stronghold.Main", "/app/stronghold.jar", ...args);
          if (result && typeof result.then === "function") {    
            await result;
          }
        } finally {
          window.CHEERP_ARGV = undefined;
          console.log = originalConsole.log;
          console.info = originalConsole.info;
          console.warn = originalConsole.warn;
          console.error = originalConsole.error;
        }

        const start = captured.indexOf('{');
        const end = captured.lastIndexOf('}');
        if (start < 0 || end < 0 || start > end) {
          throw new Error(`Stronghold JAR did not produce JSON output for classpath ${classPath}.`);
        }

        const rawJson = captured.slice(start, end + 1);
        const fixedJson = rawJson.replace(/("worldSeed"\s*:\s*)(-?\d+)/, '$1"$2"');
        return JSON.parse(fixedJson, (key, value) => {
          if (key === 'worldSeed') {
            return String(value);
          }
          return value;
        });
      }

      return await runMainWithClasspath('/app/stronghold.jar');
    }

    async function runGetStrongholds(seed) { // 2
      await loadJar('/app/app-1.0-SNAPSHOT-all.jar');
      const args = [String(seed)];

      async function runMainWithClasspath(classPath) {
        let captured = '';
        const originalConsole = {
          log: console.log,
          info: console.info,
          warn: console.warn,
          error: console.error,
        };

        const capture = (...values) => {
          captured += values.map(v => String(v)).join(' ') + '\n';
        };

        console.log = (...values) => { capture(...values); originalConsole.log(...values); };
        console.info = (...values) => { capture(...values); originalConsole.info(...values); };
        console.warn = (...values) => { capture(...values); originalConsole.warn(...values); };
        console.error = (...values) => { capture(...values); originalConsole.error(...values); };

        try {
          window.CHEERP_ARGV = args;
          const result = cheerpjRunMain("org.example.app.App", "/app/app-1.0-SNAPSHOT-all.jar", ...args);
          if (result && typeof result.then === "function") {    
            await result;
          }
        } finally {
          window.CHEERP_ARGV = undefined;
          console.log = originalConsole.log;
          console.info = originalConsole.info;
          console.warn = originalConsole.warn;
          console.error = originalConsole.error;
        }

        // console.log('Full captured output:', captured);
        
        // Parse plain text format: pairs of numbers (x, z for each stronghold)
        const lines = captured.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        const numbers = lines.map(line => parseInt(line)).filter(n => !isNaN(n));
        
        if (numbers.length < 6) {
          console.error(`Expected at least 6 numbers (3 strongholds x 2 coords), got ${numbers.length}. Raw: ${captured}`);
          throw new Error(`Stronghold JAR did not produce enough coordinate data.`);
        }

        // Group into pairs of coordinates
        const strongholds = [];
        for (let i = 0; i < 3 && i * 2 + 1 < numbers.length; i++) {
          strongholds.push({
            x: numbers[i * 2] * 16,
            z: numbers[i * 2 + 1] * 16,
            chunkX: numbers[i * 2],
            chunkZ: numbers[i * 2 + 1]
          });
        }
        
        // console.log('Parsed strongholds:', strongholds);
        return { strongholds };
      }

      return await runMainWithClasspath('/app/app-1.0-SNAPSHOT-all.jar');
    }

    async function loadData() {
      setLoading(true, 'Loading stronghold data...', 10);
      try {
        const seed = seedField.value || defaultSeed;
        const text = status.textContent;
        const seedMatch = text.match(/seed=(-?\d+)/);
        const prevSeed = seedMatch ? seedMatch[1] : null;
        const seedChanged = prevSeed !== null && prevSeed !== seed;

        if (seedChanged) {
          chunkXField.value = '';
          chunkZField.value = '';
          activeStrongholdIndex = null;
          mpkStrongholdIndex = null;
        }

        if (prevSeed !== seed) {
          const data_sh = await runGetStrongholds(seed);
          setLoading(true, 'Loading stronghold candidates...', 40);

          if (data_sh && data_sh.strongholds) {
            strongholds = data_sh.strongholds;

            const bestShResult = get_mpk_stronghold(strongholds);
            if (bestShResult) {
              const bestIdx = bestShResult.best_stronghold_idx;
              const bestSh = strongholds[bestIdx];
              mpkStrongholdIndex = bestIdx;
              activeStrongholdIndex = bestIdx;
              chunkXField.value = bestSh.chunkX;
              chunkZField.value = bestSh.chunkZ;
            }
            refreshStrongholdButtons();
          }
        }

        const chunkX = chunkXField.value !== '' ? chunkXField.value : defaultChunkX;
        const chunkZ = chunkZField.value !== '' ? chunkZField.value : defaultChunkZ;

        setLoading(true, 'Running stronghold generator...', 70);
        const data = await runStrongholdJar(seed, chunkX, chunkZ);

        setLoading(true, 'Rendering stronghold model...', 90);
        renderData(data);
        setLoading(true, 'Done loading stronghold data', 100);
      } catch (error) {
        status.textContent = 'Error loading stronghold data';
        console.error(error);
      } finally {
        setLoading(false, 'Rendering stronghold model...', 100);
      }
    }

    function strongholdButtonLabel(index) {
      const sh = strongholds[index];
      if (!sh) return `Stronghold ${index + 1}`;
      const base = `Stronghold ${index + 1}: (${sh.chunkX}, ${sh.chunkZ}) | (${sh.x}, ${sh.z})`;
      return mpkStrongholdIndex === index ? `MPK ${base}` : base;
    }

    function refreshStrongholdButtons() {
      const buttons = [stronghold1, stronghold2, stronghold3];
      buttons.forEach((button, index) => {
        if (strongholds[index]) {
          button.textContent = strongholdButtonLabel(index);
          button.dataset.index = String(index);
          const isActive = activeStrongholdIndex === index;
          button.style.background = isActive ? '#99c1f1' : '#333';
          button.style.color = isActive ? '#000' : '#fff';
        } else {
          button.style.display = 'none';
        }
      });
      updateForceMPKUI();
    }

    function updateStrongholdButtons() {
      refreshStrongholdButtons();
    }

    function updateForceMPKUI() {
      const buttons = [stronghold1, stronghold2, stronghold3];
      const isForced = forceMPK.checked;
      if (isForced && mpkStrongholdIndex !== null) {

        buttons.forEach((button, index) => {
          button.style.display = index === mpkStrongholdIndex ? 'block' : 'none';
        });
      } else {
        buttons.forEach(button => {
          if (button.dataset.index !== undefined) {
            button.style.display = 'block';
          }
        });
      }
      chunkXField.readOnly = isForced;
      chunkZField.readOnly = isForced;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    function selectStronghold(idx) {
      if (activeStrongholdIndex === idx) return;
      if (!strongholds[idx]) return;
      const sh = strongholds[idx];
      chunkXField.value = sh.chunkX;
      chunkZField.value = sh.chunkZ;
      activeStrongholdIndex = idx;
      refreshStrongholdButtons();
      loadData();
    }

    stronghold1.addEventListener('click', () => selectStronghold(0));
    stronghold2.addEventListener('click', () => selectStronghold(1));
    stronghold3.addEventListener('click', () => selectStronghold(2));
    await initCheerpJ();
    loadData();
    animate();
  </script>
</body>
</html>
